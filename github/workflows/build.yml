name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build web app
        run: |
          npm install
          npm run build
          if [ -d dist ]; then OUT=dist; elif [ -d build ]; then OUT=build; else echo "No build output folder"; exit 1; fi
          echo "OUT=$OUT" >> $GITHUB_ENV
      - name: Create Android project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Theme Hub" com.zaim.themehub --web-dir=$OUT
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Theme Hub v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
