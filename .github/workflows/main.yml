name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Ensure fixed debug.keystore is present
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          test -f debug.keystore
      - name: Print Keystore SHA-1 and SHA-256 fingerprints
        run: |
          echo "=== FIXED DEBUG KEYSTORE FINGERPRINTS ==="
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "Alias name:|SHA1:|SHA256:"
          echo "========================================="
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android
      - name: Verify Google Sign-In config before build
        run: |
          if [ -f app/google-services.json ]; then
            echo "Found app/google-services.json"
            grep -q "com.aistudio.themehub.krtx" app/google-services.json || echo "Warning: package_name mismatch in app/google-services.json"
          else
            echo "Note: app/google-services.json not found in repo; using BuildConfig.DEFAULT_WEB_CLIENT_ID and ThemeHubApplication fallback."
          fi
      - name: Build APK
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleDebug --no-daemon; else gradle assembleDebug --no-daemon; fi
      - name: Verify APK Signing Certificate SHA-1 and SHA-256
        run: |
          echo "=== SIGNED APK FINGERPRINTS ==="
          APKSIGNER=$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          else
            keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk || true
          fi
          echo "==============================="
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Theme-Hub-v${{ github.run_number }}.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Theme Hub v${{ github.run_number }}
          body: "Theme Hub - تطبيق ثيمات لجميع الهواتف"
          files: Theme-Hub-v${{ github.run_number }}.apk
